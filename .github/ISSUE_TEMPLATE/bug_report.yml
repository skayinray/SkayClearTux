name: Сообщение об ошибке
description: Что-то работает не так — расскажите, поможем
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что нашли время сообщить об ошибке! Чем точнее описание, тем
        быстрее мы починим. Пожалуйста, не прикладывайте личные данные
        (пароли, токены, полные логи с путями пользователя).
  - type: checkboxes
    id: preflight
    attributes:
      label: Перед отправкой
      options:
        - label: Я поискал похожие Issues и не нашёл дубликат
          required: true
        - label: Я использую последнюю версию SkayClearTux
          required: false
  - type: input
    id: version
    attributes:
      label: Версия SkayClearTux
      description: Видна в разделе «Настройка → О программе»
      placeholder: "например 1.4.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Операционная система
      options:
        - Linux
        - macOS
        - Windows
        - Другая (уточню ниже)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Версия ОС и окружение
      description: Дистрибутив и версия, или версия macOS/Windows; для Linux — рабочий стол (GNOME/KDE/…) и Wayland/X11
      placeholder: "например Ubuntu 24.04, GNOME, Wayland"
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Как установлено
      description: Готовая сборка (AppImage/deb/rpm/dmg/zip) или запуск из исходников
      placeholder: "например AppImage из релиза 1.3.0"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Шаги для воспроизведения
      description: Что именно вы делали по шагам
      placeholder: |
        1. Открыть раздел «...»
        2. Нажать «...»
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что произошло на самом деле
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи и вывод
      description: |
        Вставьте текст ошибки. Файл лога лежит в стандартном каталоге логов ОС
        (например `~/.local/state/SkayClearTux/skaycleartux.log` на Linux).
        Уберите личные данные.
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Скриншоты
      description: Перетащите изображения сюда, если это поможет
    validations:
      required: false
