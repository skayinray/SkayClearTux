name: build
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Системные зависимости (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 libegl1 rpm

      - name: Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pip install pyinstaller

      - name: Проверка работоспособности (Smoke Test)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python tools/smoke_test.py || true

      - name: Компиляция бинарников (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash packaging/01-linux/make_appimage.sh || true
          bash packaging/01-linux/make_deb.sh || true
          bash packaging/01-linux/make_rpm.sh || true
          mkdir -p artifacts
          cp build/*.AppImage build/deb/*.deb build/rpmbuild/RPMS/*/*.rpm artifacts/ 2>/dev/null || true

      - name: Компиляция бинарников (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --name="SkayClearTux" --add-data "skaycleartux/assets;skaycleartux/assets" SkayClearTux.py
          Compress-Archive -Path dist/SkayClearTux/* -DestinationPath dist/SkayClearTux-windows.zip
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item dist/SkayClearTux-windows.zip -Destination artifacts/

      - name: Компиляция бинарников (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          bash packaging/03-macos/build.sh || true
          mkdir -p artifacts
          cp dist/*.dmg artifacts/ 2>/dev/null || true

      - name: Публикация релиза на GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
