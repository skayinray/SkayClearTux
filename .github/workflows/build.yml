name: build
permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без префикса v (например 1.3.2)"
        required: false
        default: ""

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Определить версию
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(python3 -c "import re, pathlib; t=pathlib.Path('skaycleartux/__init__.py').read_text(); m=re.search(r'__version__\s*=\s*\"([^\"]+)\"', t); print(m.group(1) if m else '0.0.0')")" >> "$GITHUB_ENV"
          fi
          echo "Версия: ${VERSION:-unknown}"

      - name: Системные зависимости (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 libegl1 libgl1 libfuse2 rpm dpkg-dev file

      - name: Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "pyinstaller>=6.0" pillow

      - name: Проверка синтаксиса и дымовой тест
        if: matrix.os == 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python -m compileall -q skaycleartux SkayClearTux.py tools
          python tools/smoke_test.py

      - name: Сборка (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          VERSION: ${{ env.VERSION }}
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -e
          pyinstaller --noconfirm --clean --windowed \
            --name SkayClearTux \
            --add-data "skaycleartux/assets:skaycleartux/assets" \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtQuick3D \
            --exclude-module PySide6.QtMultimedia \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtWebSockets \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtDataVisualization \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtSql \
            --exclude-module PySide6.QtTest \
            --exclude-module PySide6.QtDesigner \
            --exclude-module PySide6.QtBluetooth \
            --exclude-module PySide6.QtNfc \
            --exclude-module PySide6.QtPositioning \
            --exclude-module PySide6.QtSensors \
            --exclude-module PySide6.QtSerialPort \
            --exclude-module PySide6.QtTextToSpeech \
            --exclude-module tkinter \
            SkayClearTux.py
          mkdir -p build artifacts
          bash packaging/01-linux/make_appimage.sh
          bash packaging/01-linux/make_deb.sh
          bash packaging/01-linux/make_rpm.sh
          cp build/SkayClearTux-*-x86_64.AppImage artifacts/ 2>/dev/null || true
          cp build/SkayClearTux-*-amd64.deb artifacts/ 2>/dev/null || true
          cp build/SkayClearTux-*-x86_64.rpm artifacts/ 2>/dev/null || true
          # Signed latest.json for automatic updates (AppImage).
          APPIMAGE=$(ls artifacts/SkayClearTux-*-x86_64.AppImage 2>/dev/null | head -n1)
          if [ -n "$APPIMAGE" ]; then
            SHA=$(sha256sum "$APPIMAGE" | awk '{print $1}')
            FILE=$(basename "$APPIMAGE")
            TAG="${GITHUB_REF_NAME:-v${VERSION}}"
            cat > artifacts/latest.unsigned.json <<EOF
          {
            "version": "${VERSION}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE}",
            "sha256": "${SHA}",
            "notes": "SkayClearTux ${VERSION}",
            "published": "$(date -u +%Y-%m-%d)"
          }
          EOF
            if [ -n "${SIGNING_KEY:-}" ]; then
              python tools/sign_update.py manifest artifacts/latest.unsigned.json artifacts/latest.json
            elif [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
              echo "::error::RELEASE_SIGNING_KEY is required for tagged releases"
              exit 1
            fi
          fi
          ls -la artifacts

      - name: Сборка (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name="SkayClearTux" \
            --add-data "skaycleartux/assets;skaycleartux/assets" \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtQuick3D \
            --exclude-module PySide6.QtMultimedia \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtWebSockets \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtDataVisualization \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtSql \
            --exclude-module PySide6.QtTest \
            --exclude-module PySide6.QtDesigner \
            --exclude-module PySide6.QtBluetooth \
            --exclude-module PySide6.QtNfc \
            --exclude-module PySide6.QtPositioning \
            --exclude-module PySide6.QtSensors \
            --exclude-module PySide6.QtSerialPort \
            --exclude-module PySide6.QtTextToSpeech \
            --exclude-module tkinter \
            SkayClearTux.py
          mkdir -p artifacts
          (cd dist && 7z a ../artifacts/SkayClearTux-windows.zip SkayClearTux) || \
            powershell -Command "Compress-Archive -Path dist/SkayClearTux/* -DestinationPath artifacts/SkayClearTux-windows.zip"
          ls -la artifacts

      - name: Сборка (macOS)
        if: matrix.os == 'macos-latest'
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e
          bash packaging/03-macos/build.sh
          mkdir -p artifacts
          cp dist/*.dmg artifacts/
          ls -la artifacts

      - name: Подписать артефакты релиза
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -e
          rm -f artifacts/latest.unsigned.json
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::warning::RELEASE_SIGNING_KEY is not set; artifacts are unsigned"
            exit 0
          fi
          for f in artifacts/*; do
            case "$f" in
              *.sig|*latest.unsigned.json) continue ;;
            esac
            [ -f "$f" ] || continue
            python tools/sign_update.py file "$f"
          done

      - name: Загрузить артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: SkayClearTux-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: warn

      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
