name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Системные зависимости (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 libegl1

      - name: Установка зависимостей Python (Все ОС)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Линтер (ruff)
        run: python -m ruff check skaycleartux tests tools

      - name: Формат (black) — мягкий режим
        continue-on-error: true
        run: python -m black --check skaycleartux tests tools

      - name: Типы (mypy) — мягкий режим
        continue-on-error: true
        run: python -m mypy

      - name: Проверка синтаксиса
        run: python -m compileall -q skaycleartux SkayClearTux.py tools tests

      - name: Тест менеджеров пакетов Linux
        if: matrix.os == 'ubuntu-latest'
        run: python tools/pkg_check.py

      - name: Импорт бэкенда текущей ОС
        run: python -c "from skaycleartux.backends import get_backend; b=get_backend(); print(b.name, b.display)"

      - name: Тесты (Linux, с покрытием)
        if: matrix.os == 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python -m pytest -k 'not test_ui and not test_interface' --ignore=tests/test_ui_main_window.py -k 'not test_ui and not test_interface' --ignore=tests/test_main_window.py -q
          --cov=skaycleartux.backends
          --cov=skaycleartux.cleaner
          --cov-report=term-missing
          --cov-report=xml

      - name: Тесты (macOS / Windows)
        if: matrix.os != 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -k 'not test_ui and not test_interface' --ignore=tests/test_ui_main_window.py -k 'not test_ui and not test_interface' --ignore=tests/test_main_window.py -q

      - name: Загрузить отчёт покрытия
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Дымовой тест интерфейса (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/smoke_test.py
