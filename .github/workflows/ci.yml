name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6

      - name: Проверка синтаксиса
        run: python -m compileall -q skaycleartux SkayClearTux.py

      - name: Тест менеджеров пакетов Linux
        run: python tools/pkg_check.py

      - name: Импорт бэкенда текущей ОС
        run: python -c "from skaycleartux.backends import get_backend; b=get_backend(); print(b.name, b.display)"

      - name: Дымовой тест интерфейса (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/smoke_test.py
