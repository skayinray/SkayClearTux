name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check skaycleartux tests tools

      - name: Format check (black, advisory)
        continue-on-error: true
        run: python -m black --check skaycleartux tests tools

      - name: Type check (mypy, advisory)
        continue-on-error: true
        run: python -m mypy

      - name: Compile sources
        run: python -m compileall -q skaycleartux SkayClearTux.py tools tests

      - name: Linux package manager check
        if: matrix.os == 'ubuntu-latest'
        run: python tools/pkg_check.py

      - name: Import current OS backend
        run: python -c "from skaycleartux.backends import get_backend; b=get_backend(); print(b.name, b.display)"

      - name: Tests with coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python -m pytest -q
          -k 'not test_ui and not test_interface'
          --ignore=tests/test_ui_main_window.py
          --ignore=tests/test_main_window.py
          --cov=skaycleartux.backends
          --cov=skaycleartux.cleaner
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=60

      - name: Tests (macOS and Windows)
        if: matrix.os != 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python -m pytest -q
          -k 'not test_ui and not test_interface'
          --ignore=tests/test_ui_main_window.py
          --ignore=tests/test_main_window.py

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Offscreen UI smoke test
        # Qt's offscreen plugin hangs during teardown on macOS runners.
        if: matrix.os != 'macos-latest'
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python tools/smoke_test.py
