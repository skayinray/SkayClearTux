[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skaycleartux"
version = "1.5.3.2"
description = "Кроссплатформенный системный помощник для Linux, macOS и Windows: очистка, мониторинг, инструменты и шахматы"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "skayinray", email = "officialidea78@gmail.com" }]
keywords = ["system", "cleaner", "monitor", "linux", "macos", "windows", "pyside6", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0", "pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/skayinray/SkayClearTux"
Repository = "https://github.com/skayinray/SkayClearTux"
Issues = "https://github.com/skayinray/SkayClearTux/issues"
Changelog = "https://github.com/skayinray/SkayClearTux/blob/main/CHANGELOG.md"

[project.scripts]
skaycleartux = "skaycleartux.__main__:main"

[project.gui-scripts]
skaycleartux-gui = "skaycleartux.__main__:main"

[tool.setuptools]
packages = ["skaycleartux", "skaycleartux.backends"]

[tool.setuptools.package-data]
skaycleartux = ["assets/*", "assets/pieces/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
    "E501",  # длину строк держим под контролем, но не ломаем сборку
    "E702",  # в проекте приняты короткие однострочники через `;`
    "E741",  # Qt-код исторически использует `l`, `I` для локальных виджетов
    "N802",  # Qt-оверрайды обязаны быть camelCase (paintEvent, keyPressEvent)
    "I001",  # импорты свёрнуты вручную «заполняющим» стилем, а не по одному в строке
]

# --------------------------------------------------------------------------- #
#  Тесты (pytest + pytest-qt + pytest-cov)
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ui: тесты, требующие QApplication (запускаются в offscreen-режиме)",
]
# pytest-qt: используем PySide6 и offscreen-платформу (см. tests/conftest.py)
qt_api = "pyside6"

[tool.coverage.run]
branch = true
source = ["skaycleartux"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# --------------------------------------------------------------------------- #
#  Форматирование и типы (мягкий режим — см. CONTRIBUTING.md)
# --------------------------------------------------------------------------- #
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
check_untyped_defs = false
# мягкий режим: в CI ошибки типов не блокируют сборку
files = ["skaycleartux"]
