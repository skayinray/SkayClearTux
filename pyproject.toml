[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skaycleartux"
version = "1.2.0"
description = "Кроссплатформенный системный помощник для Linux, macOS и Windows: очистка, мониторинг, инструменты и шахматы"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SkayClearTux", email = "t.me/imneedasleep" }]
keywords = ["system", "cleaner", "monitor", "linux", "macos", "windows", "pyside6", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0", "pillow>=10.0"]
dev = ["ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/skayinray/SkayClearTux"
Repository = "https://github.com/skayinray/SkayClearTux"
Issues = "https://github.com/skayinray/SkayClearTux/issues"
Changelog = "https://github.com/skayinray/SkayClearTux/blob/main/CHANGELOG.md"

[project.scripts]
skaycleartux = "skaycleartux.__main__:main"

[project.gui-scripts]
skaycleartux-gui = "skaycleartux.__main__:main"

[tool.setuptools]
packages = ["skaycleartux", "skaycleartux.backends"]

[tool.setuptools.package-data]
skaycleartux = ["assets/*", "assets/pieces/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]
